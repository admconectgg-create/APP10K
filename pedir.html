<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Faça seu pedido</title>
<meta name="description" content="Cardápio e pedidos para entrega ou retirada.">
<meta name="theme-color" content="#0D0A08" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0A08" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="icon-192.png?v=f6fc060c">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=f6fc060c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@700;800&family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FAF6F1;--surface:#FFFFFF;--surface-2:#F3ECE4;--ink:#211A15;--muted:#6E6259;--line:#E7DED4;
  --accent:#C2410C;--on-accent:#FFFFFF;--accent-soft:#FCE9DE;--accent-ink:#9A3412;
  --ok:#1D7A45;--ok-soft:#DDF3E6;--warn:#9A5200;--warn-soft:#FCE8CC;--late:#B3261E;--late-soft:#FBE0DE;
  --tint-esp:#FBE6D9;--tint-jan:#FAEFD3;--tint-por:#E7F0DC;--tint-beb:#DCEDF8;--tint-lan:#FBEAD2;
  --scrim:rgba(24,14,8,.45);--shadow:0 1px 2px rgba(40,24,12,.06),0 6px 20px rgba(40,24,12,.07);
  --f-display:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15110E;--surface:#1F1915;--surface-2:#2A221C;--ink:#F3EBE4;--muted:#B3A69B;--line:#3A2F27;
  --accent:#FB8A4C;--on-accent:#1A0F08;--accent-soft:#3A2214;--accent-ink:#FDBA8C;
  --ok:#7BD7A0;--ok-soft:#173226;--warn:#F5B35A;--warn-soft:#33240D;--late:#FF9A92;--late-soft:#3A1A19;
  --tint-esp:#3D3431;--tint-jan:#3A3626;--tint-por:#2C3427;--tint-beb:#22303B;--tint-lan:#3A3024;
  --scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15110E;--surface:#1F1915;--surface-2:#2A221C;--ink:#F3EBE4;--muted:#B3A69B;--line:#3A2F27;
  --accent:#FB8A4C;--on-accent:#1A0F08;--accent-soft:#3A2214;--accent-ink:#FDBA8C;
  --ok:#7BD7A0;--ok-soft:#173226;--warn:#F5B35A;--warn-soft:#33240D;--late:#FF9A92;--late-soft:#3A1A19;
  --tint-esp:#3D3431;--tint-jan:#3A3626;--tint-por:#2C3427;--tint-beb:#22303B;--tint-lan:#3A3024;
  --scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{padding-bottom:120px}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

/* topo */
.hero{padding-block:26px 6px}
.eyebrow{margin:0 0 6px;font:500 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.hero h1{margin:0;font:800 clamp(30px,8.4vw,46px)/1.05 var(--f-display);letter-spacing:-.025em;text-wrap:balance;overflow-wrap:anywhere}
.state{display:inline-flex;align-items:center;gap:8px;margin:14px 0 0;padding:5px 12px;border-radius:99px;font-weight:600;font-size:13.5px}
.state i{width:8px;height:8px;border-radius:50%;background:currentColor}
.state.open{background:var(--ok-soft);color:var(--ok)}
.state.closed{background:var(--late-soft);color:var(--late)}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 0;padding:0;list-style:none;color:var(--muted);font-size:14px}
.facts b{color:var(--ink);font-weight:600}
.closedbox{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.closedbox b{display:block}
.track{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--accent);background:var(--accent-soft);text-align:left;cursor:pointer}
.track span{flex:1;min-width:0}
.track small{display:block;color:var(--muted);font-size:13px}
.track b{display:block;font-weight:700}
.track svg{flex:none;color:var(--accent)}

/* temas que o gerente escolhe no app (Gerência › Ajustes › Tema) */
:root[data-skin="natal"]{--accent:#B3261E;--on-accent:#FFFFFF;--accent-soft:#FBE3E0;--accent-ink:#9B1C16;--snow:#BFD0E0}
@media (prefers-color-scheme:dark){:root[data-skin="natal"]:not([data-theme="light"]){--accent:#FF6B5E;--on-accent:#2B0604;--accent-soft:#3A1C19;--accent-ink:#FFB4AB;--snow:#FFFFFF}}
:root[data-skin="natal"][data-theme="dark"]{--accent:#FF6B5E;--on-accent:#2B0604;--accent-soft:#3A1C19;--accent-ink:#FFB4AB;--snow:#FFFFFF}
:root[data-skin="natal"] .hero:not(.th){position:relative;padding-top:40px}
:root[data-skin="natal"] .hero:not(.th)::before,:root[data-skin="natal"] .hero:not(.th)::after{content:"";position:absolute;left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));top:6px;height:16px;pointer-events:none;background-repeat:repeat-x;background-size:56px 16px}
:root[data-skin="natal"] .hero:not(.th)::before{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='16'><path d='M0 3Q14 10 28 3Q42 10 56 3' fill='none' stroke='%23395E45' stroke-width='1.3'/><circle cx='7' cy='9.8' r='5' fill='%23E53935' opacity='.22'/><rect x='5.6' y='4.8' width='2.8' height='2.4' rx='.6' fill='%23395E45'/><ellipse cx='7' cy='9.8' rx='2.5' ry='3.3' fill='%23E53935'/><circle cx='35' cy='9.8' r='5' fill='%2343A047' opacity='.22'/><rect x='33.6' y='4.8' width='2.8' height='2.4' rx='.6' fill='%23395E45'/><ellipse cx='35' cy='9.8' rx='2.5' ry='3.3' fill='%2343A047'/></svg>");animation:fx-blink 1.4s steps(1) infinite}
:root[data-skin="natal"] .hero:not(.th)::after{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='16'><circle cx='21' cy='9.8' r='5' fill='%23F4C430' opacity='.22'/><rect x='19.6' y='4.8' width='2.8' height='2.4' rx='.6' fill='%23395E45'/><ellipse cx='21' cy='9.8' rx='2.5' ry='3.3' fill='%23F4C430'/><circle cx='49' cy='9.8' r='5' fill='%2342A5F5' opacity='.22'/><rect x='47.6' y='4.8' width='2.8' height='2.4' rx='.6' fill='%23395E45'/><ellipse cx='49' cy='9.8' rx='2.5' ry='3.3' fill='%2342A5F5'/></svg>");animation:fx-blink 1.4s steps(1) .7s infinite}
:root[data-skin="natal"] body::before{content:"";position:fixed;left:0;right:0;top:0;height:45vh;pointer-events:none;z-index:-1;background-image:radial-gradient(3px 3px at 8% 12%,var(--snow,#C9D6E3) 50%,transparent 52%),radial-gradient(2px 2px at 22% 64%,var(--snow,#C9D6E3) 50%,transparent 52%),radial-gradient(3.4px 3.4px at 37% 30%,var(--snow,#C9D6E3) 50%,transparent 52%),radial-gradient(2.2px 2.2px at 51% 82%,var(--snow,#C9D6E3) 50%,transparent 52%),radial-gradient(3px 3px at 66% 18%,var(--snow,#C9D6E3) 50%,transparent 52%),radial-gradient(2px 2px at 79% 55%,var(--snow,#C9D6E3) 50%,transparent 52%),radial-gradient(3.2px 3.2px at 91% 36%,var(--snow,#C9D6E3) 50%,transparent 52%),radial-gradient(2.4px 2.4px at 15% 92%,var(--snow,#C9D6E3) 50%,transparent 52%),radial-gradient(2px 2px at 45% 6%,var(--snow,#C9D6E3) 50%,transparent 52%),radial-gradient(2.8px 2.8px at 72% 74%,var(--snow,#C9D6E3) 50%,transparent 52%);background-size:100% 40vh;animation:fx-snow 12s linear infinite;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
:root[data-skin="brasa"] .hero:not(.th){position:relative;overflow:hidden;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:28px 22px;border-radius:0 0 24px 24px;color:#FFF3E8;background:radial-gradient(90% 120% at 50% 125%,#8A300E 0%,#3B170A 48%,#1A0F0A 100%)}
:root[data-skin="brasa"] .hero:not(.th)>*{position:relative}
:root[data-skin="brasa"] .hero:not(.th)::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.9;background-image:radial-gradient(2px 2px at 12% 70%,#FF8A3D 50%,transparent 51%),radial-gradient(1.6px 1.6px at 34% 85%,#FFB347 50%,transparent 51%),radial-gradient(2.2px 2.2px at 58% 62%,#FF6A1A 50%,transparent 51%),radial-gradient(1.6px 1.6px at 80% 78%,#FFB347 50%,transparent 51%),radial-gradient(2px 2px at 92% 66%,#FF8A3D 50%,transparent 51%),radial-gradient(1.4px 1.4px at 46% 94%,#FFD27A 50%,transparent 51%);background-size:100% 120px;animation:fx-sparks 6s linear infinite}
:root[data-skin="brasa"] .hero:not(.th) .eyebrow{color:#FFB27A}
:root[data-skin="brasa"] .hero:not(.th) .facts{color:rgba(255,243,232,.72)}:root[data-skin="brasa"] .hero:not(.th) .facts b{color:#FFF3E8}
:root[data-skin="brasa"] .hero:not(.th) .closedbox,:root[data-skin="brasa"] .hero:not(.th) .track{background:rgba(255,255,255,.09);color:#FFF3E8}
:root[data-skin="brasa"] .hero:not(.th) .track small{color:rgba(255,243,232,.72)}
/* tema da marca (logo preta, fogo e dourado): fica escuro mesmo com o celular no modo claro */
:root[data-skin="noite"]{--bg:#0D0A08;--surface:#17120E;--surface-2:#221A14;--ink:#F5EBDD;--muted:#B9A893;--line:#352A20;--accent:#F2A93B;--on-accent:#1A1006;--accent-soft:#33240F;--accent-ink:#F7C66A;--ok:#5FD38D;--ok-soft:#12291B;--warn:#FF9A3C;--warn-soft:#3A2210;--late:#FF6B5B;--late-soft:#3D1712;--tint-esp:#3B2419;--tint-jan:#3A2D15;--tint-por:#28301D;--tint-beb:#1A2B33;--tint-lan:#3D2C14;--scrim:rgba(0,0,0,.66);--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);--f-brand:"Bitter",Georgia,"Times New Roman",serif;color-scheme:dark}
:root[data-skin="noite"] .hero:not(.th){position:relative;overflow:hidden;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:18px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));border-radius:0 0 26px 26px;border-bottom:1px solid #2E231A;text-align:center;background:radial-gradient(85% 70% at 50% 122%,rgba(214,82,18,.5),rgba(214,82,18,0) 72%),repeating-linear-gradient(180deg,rgba(255,200,140,.03) 0 2px,transparent 2px 13px),#0D0A08}
:root[data-skin="noite"] .hero:not(.th)>*{position:relative}
:root[data-skin="noite"] .hero:not(.th)::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.85;background-image:radial-gradient(2px 2px at 12% 70%,#FF8A3D 50%,transparent 51%),radial-gradient(1.6px 1.6px at 34% 85%,#FFB347 50%,transparent 51%),radial-gradient(2.2px 2.2px at 58% 62%,#FF6A1A 50%,transparent 51%),radial-gradient(1.6px 1.6px at 80% 78%,#FFB347 50%,transparent 51%),radial-gradient(2px 2px at 92% 66%,#FF8A3D 50%,transparent 51%),radial-gradient(1.4px 1.4px at 46% 94%,#FFD27A 50%,transparent 51%);background-size:100% 120px;animation:fx-sparks 6s linear infinite}
:root[data-skin="noite"] .hero .hlogo{width:min(54vw,200px);height:auto;margin:0 auto 6px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
:root[data-skin="noite"] .hero.haslogo .eyebrow,:root[data-skin="noite"] .hero.haslogo h1{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:root[data-skin="noite"] .hero h1,:root[data-skin="noite"] .sec h2,:root[data-skin="noite"] .info h2{font-family:var(--f-brand);font-weight:800;letter-spacing:0;color:#F2B54A}
:root[data-skin="noite"] .hero .sobre{color:#EADBC4}
:root[data-skin="noite"] .hero .facts{justify-content:center}
:root[data-skin="noite"] .btn.pri,:root[data-skin="noite"] .bagbtn,:root[data-skin="noite"] .ci-add{background:linear-gradient(180deg,#F8C056,#E8892E);color:#1A1006;border-color:transparent}
:root[data-skin="noite"] .ci-add{box-shadow:0 2px 10px rgba(232,137,46,.35)}
:root[data-skin="noite"] .bagbtn .n{background:rgba(26,16,6,.18)}
:root[data-skin="noite"] .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@keyframes fx-blink{0%{opacity:1}50%{opacity:.35}}
@keyframes fx-snow{from{background-position:0 0}to{background-position:0 40vh}}
@keyframes fx-sparks{from{background-position:0 0}to{background-position:0 -120px}}
@media (prefers-reduced-motion:reduce){:root[data-skin] .hero::before,:root[data-skin] .hero::after,:root[data-skin] body::before{animation:none}}

/* categorias */
.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-block:10px;background:var(--bg);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sec{scroll-margin-top:70px;margin-top:16px}
.sec h2{margin:0 0 10px;font:700 20px/1.2 var(--f-display);letter-spacing:-.01em}

/* cartões */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(136px,100%),1fr));gap:12px}
.ci{position:relative;display:flex;flex-direction:column;min-width:0;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.ci.has{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),var(--shadow)}
.ci.out .th{filter:grayscale(1);opacity:.5}
.ci-main{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0;padding:8px 8px 12px;border:0;background:transparent;text-align:left;cursor:pointer}
.ci-main:disabled{cursor:default}
.ci-d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:13px;line-height:1.35;font-weight:400}
.sheet .desc{margin:6px 0 0;color:var(--muted);line-height:1.45}
.ci-tx{display:grid;gap:2px;min-width:0;padding:0 46px 0 4px}
.ci-tx b{font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.ci-tx span{font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.ci-add{position:absolute;right:10px;bottom:10px;display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:var(--accent);color:var(--on-accent);cursor:pointer;box-shadow:0 2px 8px rgba(194,65,12,.35)}
.ci-q{position:absolute;z-index:1;top:14px;right:14px;min-width:28px;height:28px;padding:0 8px;border-radius:99px;background:var(--accent);color:var(--on-accent);font:700 14px/28px var(--f-body);text-align:center}
.ci-out{position:absolute;z-index:1;top:14px;left:14px;padding:3px 8px;border-radius:7px;background:var(--late-soft);color:var(--late);font:700 12px var(--f-body)}

/* imagens */
.th{flex:none;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:11px;background:var(--th-bg,var(--surface-2));overflow:hidden;vertical-align:middle}
.th svg{display:block;width:88%;height:88%}
.th img{display:block;width:100%;height:100%;object-fit:cover}
.th.t-esp{--th-bg:var(--tint-esp)}.th.t-jan{--th-bg:var(--tint-jan)}.th.t-por{--th-bg:var(--tint-por)}.th.t-beb{--th-bg:var(--tint-beb)}.th.t-lan{--th-bg:var(--tint-lan)}
.th.big{display:grid;width:100%;height:auto;aspect-ratio:16/10;border-radius:11px}
.th.big svg{width:auto;height:98%}
.th.hero{display:grid;width:100%;height:auto;aspect-ratio:16/8;border-radius:16px}
.th.hero svg{width:auto;height:96%}
.th.s40{width:44px;height:44px}

/* sacola */
.bagbar{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 62%,transparent)}
.bagbtn{display:flex;align-items:center;gap:12px;width:100%;max-width:948px;min-height:58px;margin:0 auto;padding:0 18px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 8px 20px rgba(194,65,12,.3)}
.bagbtn .n{display:grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:99px;background:rgba(255,255,255,.24);font-size:14px}
.bagbtn .t{margin-left:auto;font-variant-numeric:tabular-nums}

/* janelas */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim)}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-radius:22px 22px 0 0;background:var(--surface);box-shadow:0 -10px 30px rgba(0,0,0,.18);overscroll-behavior:contain}
@media (min-width:720px){.sheet{left:50%;right:auto;top:50%;bottom:auto;width:min(560px,calc(100vw - 32px));max-height:88vh;border-radius:22px;transform:translate(-50%,-50%);padding-bottom:16px}}
.sheet h2{margin:14px 0 2px;font:700 22px/1.2 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sh-h h2{margin:0}
.x{display:grid;place-items:center;width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.x-abs{position:absolute;z-index:2;top:24px;right:max(24px,calc(env(safe-area-inset-right,0px) + 24px))}
.price{margin:0;font-weight:700;font-size:17px;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.lb{display:block;margin:18px 0 6px;font-weight:600;font-size:14px}
.addrow{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.addrow:last-of-type{border-bottom:0}
.addrow input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--accent)}
.addrow span{flex:1;font-weight:500}
.addrow b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.sheet-f{position:sticky;bottom:-16px;display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px 0 16px;background:var(--surface)}
.sheet-f .btn{flex:1}
.step{display:inline-flex;align-items:center;flex:none;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.step button{width:46px;height:50px;border:0;background:transparent;font-size:22px;font-weight:600;cursor:pointer}
.step button:disabled{opacity:.35;cursor:default}
.step b{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.step.sm button{width:40px;height:40px;font-size:20px}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;text-align:center;text-decoration:none;color:var(--ink);cursor:pointer}
.btn.pri{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.btn.big{width:100%;min-height:58px;font-size:16px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-ink)}
.top{display:flex;align-items:center;gap:12px;padding-block:18px 4px}
.top h1{margin:0;font:700 22px/1.2 var(--f-display)}
.back{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.box{margin-top:14px;padding:2px 16px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.box>h2{margin:16px 0 2px;font:600 12.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fld{display:grid;gap:6px;margin-top:12px;min-width:0}
.g2{display:grid;grid-template-columns:minmax(0,1fr);gap:0 10px}
@media (min-width:410px){.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g2 .inp{padding:0 12px}}
.who-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.who-h h2{margin:0;font:600 12.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.who-h .lnk{min-height:40px;padding:0 4px;border:0;background:none;color:var(--accent-ink);font-weight:700;font-size:14.5px;cursor:pointer}
.who-p{margin:8px 0 0;line-height:1.45}
.fld label{font-weight:600;font-size:14px}
.inp{width:100%;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px var(--f-body)}
textarea.inp{min-height:80px;padding:12px 14px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:0}
.inp[aria-invalid="true"]{border-color:var(--late)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin-top:14px;padding:4px;border-radius:14px;background:var(--surface-2)}
.seg button{min-height:46px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pays{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.hint{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.err{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:var(--late-soft);color:var(--late);font-weight:600}
.err small{display:block;margin-top:4px;font-weight:400;font-size:12px;opacity:.85;overflow-wrap:anywhere}
.note{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--surface-2)}

/* resumo */
.lines{margin:6px 0 0;padding:0;list-style:none}
.ln{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ln:last-child{border-bottom:0}
.ln-tx{min-width:0}
.ln-tx b{display:block;font-weight:600;overflow-wrap:anywhere}
.ln-tx small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.ln-tx .ad{color:var(--accent-ink);font-weight:600}
.ln-tx .bad{color:var(--late);font-weight:700}
.ln-p{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ln-r{grid-column:2/4;display:flex;align-items:center;justify-content:space-between;gap:10px}
.tots{display:grid;gap:6px;margin-top:10px;padding-top:12px;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}
.tots div{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
.tots .big{color:var(--ink);font-weight:700;font-size:18px}

/* acompanhamento */
.stat-hero{display:grid;justify-items:center;gap:4px;padding-block:18px 4px;text-align:center}
.stat-ic{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--accent-soft);color:var(--accent)}
.stat-ic.ok{background:var(--ok-soft);color:var(--ok)}
.stat-ic.bad{background:var(--late-soft);color:var(--late)}
.stat-hero h2{margin:10px 0 0;font:700 24px/1.2 var(--f-display);text-wrap:balance}
.stat-hero p{margin:0;max-width:40ch;color:var(--muted)}
.code{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:99px;background:var(--surface-2);font:600 14px var(--f-mono)}
.steps{margin:20px 0 0;padding:0;list-style:none}
.steps li{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding-bottom:18px}
.steps li::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child{padding-bottom:0}
.steps li:last-child::before{display:none}
.steps .dot{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--on-accent)}
.steps li.done .dot{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.steps li.done::before{background:var(--ok)}
.steps li.now .dot{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft);animation:pulse 1.6s ease-in-out infinite}
.steps b{display:block;font-weight:600}
.steps small{display:block;color:var(--muted)}
.steps li:not(.done):not(.now) b{color:var(--muted);font-weight:500}
@keyframes pulse{50%{box-shadow:0 0 0 9px var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){.steps li.now .dot{animation:none}}
.acts{display:grid;gap:10px;margin-top:18px}

/* carregando e avisos */
.skel{border-radius:var(--r);background:var(--surface-2);animation:sk 1.2s ease-in-out infinite}
@keyframes sk{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.empty{display:grid;justify-items:center;gap:8px;padding:56px 12px;text-align:center}
.empty h1{margin:0;font:700 24px var(--f-display)}
.empty p{margin:0;max-width:42ch;color:var(--muted)}
#toast{position:fixed;z-index:60;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px)}
#toast div{padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;box-shadow:var(--shadow)}
.hero .hlogo{display:block;width:80px;height:80px;margin:0 0 10px;object-fit:contain}
.sobre{margin:6px 0 0;color:var(--muted);font-size:15px;line-height:1.4;text-wrap:balance}
/* sobre o restaurante: horário, endereço, WhatsApp e Instagram */
.info{margin-top:36px}
.info h2{margin:0 0 10px;font:700 20px/1.2 var(--f-display);letter-spacing:-.01em}
.inf{margin:0;padding:0 14px;list-style:none;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.inf li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.inf li:last-child{border-bottom:0}
.inf .ii{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink)}
.inf .tx{flex:1;min-width:0}
.inf .tx b{display:block;font-weight:600;font-size:12.5px;letter-spacing:.02em;color:var(--muted)}
.inf .tx span{display:block;font-weight:500;overflow-wrap:anywhere}
.inf .btn{flex:none;min-height:40px;padding:0 14px;font-size:14px}
</style>
</head>

function statusInfo(o){

    case 'saiu':return ret?{title:code+' pronto para retirar',sub:'Pode vir buscar.',ic:ICON.shop,step:3}:{title:code+' saiu para entrega',sub:'Já está a caminho.',ic:ICON.moto,step:3};
    case 'entregue':return {title:ret?code+' retirado':code+' entregue',sub:'Obrigado pela preferência! Bom apetite.',ic:ICON.done,step:4,cls:'ok'};
    case 'recusado':return {title:'Pedido não aceito',sub:o.motivo?String(o.motivo):'O restaurante não conseguiu aceitar o pedido agora.',ic:ICON.stop,step:0,cls:'bad'};

  }
}

function addToBag(id,qty,adds,note){
  const m=S.menu[id];if(!m)return false;
  if(maxMore(id)<qty){toast(maxMore(id)>0?'Só restam '+maxMore(id)+' de '+m.name+'.':'Acabou: '+m.name+'.');return false}
  note=String(note||'').trim().slice(0,60);
  const k=keyOf(id,adds,note),cur=S.bag.find(l=>l.k===k);
  if(cur)cur.qty+=qty;else S.bag.push({k:k,item:id,qty:qty,adds:adds.slice(),note:note});

/* ---------- enviar ---------- */
function validate(){
  const f=S.form,bad={};let msg='';
  if(!f.nome.trim()){bad.nome=1;msg=msg||'Digite o seu nome.'}
  const d=foneDigits(f.fone);if(d.length<10||d.length>11){bad.fone=1;msg=msg||'Digite o WhatsApp com DDD.'}
  if(f.tipo!=='retirada'){if(f.end.trim().length<5){bad.end=1;msg=msg||'Digite a rua e o número.'}if(!f.bairro.trim()){bad.bairro=1;msg=msg||'Digite o bairro.'}}
  if(!f.pay)msg=msg||'Escolha a forma de pagamento.';
  if(f.pay==='din'&&f.troco){const t=parseMoney(f.troco);if(t&&t<bagSub()+fee()){bad.troco=1;msg=msg||'O troco precisa ser para um valor maior que o total.'}}
  S.bad=bad;if(Object.keys(bad).length)S.editCli=true;return msg||bagProblem();
}
const withTimeout=(p,ms,code)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error(code),{code:code})),ms))]);
function clearErr(){S.formErr='';S.errInfo='';S.waFallback=false}
/* texto do pedido para mandar pelo WhatsApp, se o envio pelo site falhar */
function waOrderText(){
  const f=S.form,ls=bagLines(),sub=bagSub(),fe=fee(),ret=f.tipo==='retirada';
  const L=['Olá! Quero fazer um pedido pelo site:',''];
  ls.forEach(l=>L.push(l.qty+'× '+l.info.m.name+(l.info.ads.length?' (+ '+l.info.ads.map(a=>a.name).join(', ')+')':'')+(l.note?' – '+l.note:'')+' – '+brl(l.info.total)));
  L.push('','Itens: '+brl(sub),(ret?'Retirada: ':'Entrega: ')+(fe?brl(fe):'grátis'),'Total: '+brl(sub+fe),'');
  L.push(ret?'Vou retirar no local.':'Entregar em: '+f.end.trim()+(f.bairro.trim()?' – '+f.bairro.trim():''));
  L.push('Nome: '+f.nome.trim()+' · '+fmtFone(f.fone));
  L.push('Pagamento: '+(METHODS[f.pay]||'')+(f.pay==='din'&&parseMoney(f.troco)?' (troco para '+brl(parseMoney(f.troco))+')':''));
  if(f.obs.trim())L.push('Obs.: '+f.obs.trim());
  return L.join('\n');
}
const waOrderLink=()=>'https://wa.me/'+waNumber(siteCfg().fone)+'?text='+encodeURIComponent(waOrderText());
async function submitOrder(){
  if(S.sending)return;
  const err=validate();if(err){clearErr();S.formErr=err;render(true);const b=document.querySelector('[aria-invalid="true"]');if(b)b.focus();else{const e=$('.err');if(e)e.scrollIntoView({block:'center'})}return}
  if(!isOpen()){clearErr();S.formErr='O restaurante fechou agora. Tente mais tarde.';render(true);return}
  clearErr();S.sending=true;render(true);
  const sb=fxSnap($('#sendBtn')),d1=sb?playFx(fxKind(skinNow(),'ok'),sb.r,sb.rad):0,t1=Date.now()+d1;
  let r;
  try{
    // o login anônimo pode ter caído (acontece em alguns iPhones): entra de novo antes de enviar
    let u=F.auth.currentUser;
    if(!u)u=(await withTimeout(F.AU.signInAnonymously(F.auth),15000,'login-demorou')).user;
    const f=S.form,ls=bagLines(),sub=bagSub(),fe=fee(),ret=f.tipo==='retirada';
    const data={uid:u.uid,status:'novo',at:Date.now(),day:dayKey(Date.now()),tipo:ret?'retirada':'entrega',nome:f.nome.trim().slice(0,60),fone:fmtFone(f.fone).slice(0,30),
      end:ret?'':f.end.trim().slice(0,140),bairro:ret?'':f.bairro.trim().slice(0,60),ref:'',obs:f.obs.trim().slice(0,100),pay:f.pay,troco:f.pay==='din'?parseMoney(f.troco):0,
      items:ls.slice(0,40).map(l=>({item:l.item,name:String(l.info.m.name||''),cents:l.info.unit,qty:l.qty,note:l.note||'',adds:l.info.ads.map(a=>({id:a.id,name:a.name,cents:a.cents}))})),sub:sub,fee:fe,total:sub+fe};
    const FS=F.FS,ref=FS.doc(FS.collection(F.db,'online')),id=ref.id;
    lsSet(LSK.cli,JSON.stringify({nome:data.nome,fone:data.fone,end:f.end.trim(),bairro:f.bairro.trim(),pay:f.pay,tipo:data.tipo}));S.cli={nome:data.nome};S.editCli=false;
    const save=FS.setDoc(ref,data);
    r=await Promise.race([save.then(()=>'ok',e=>e),new Promise(res=>setTimeout(()=>res('slow'),12000))]);
    if(r!=='ok'&&r!=='slow')throw r;
    const k2=r==='ok'?fxKind(skinNow(),'saiu'):'';
    if(k2){const w=t1-Date.now()-400;if(w>0)await new Promise(res=>setTimeout(res,w));S.sentFx=true;render(true);const b2=fxSnap($('#sendBtn')),d2=b2?playFx(k2,b2.r,b2.rad):0;if(d2)await new Promise(res=>setTimeout(res,Math.min(d2,1150)));S.sentFx=false}
    S.orderId=id;S.order=r==='ok'?data:null;S.pendSend=r==='slow';S.firstOrder=false;lsSet(LSK.last,JSON.stringify({id:id,at:Date.now()}));
    S.bag=[];saveBag();S.sending=false;S.view='status';S.form.obs='';S.form.troco='';
    try{history.replaceState({v:'status'},'')}catch(e){}
    if(r==='slow')save.then(()=>{S.pendSend=false;render(true)},()=>{S.pendSend=false;forgetOrder();toast('Não consegui enviar o pedido. Tente de novo.');render(true)});
    watchOrder(id);window.scrollTo(0,0);render(true);
  }catch(e){
    const code=String((e&&e.code)||'');
    S.sending=false;
    S.formErr=code==='permission-denied'?'Não consegui enviar: o restaurante pode ter fechado agora. Confira e tente de novo.':'Não consegui enviar o pedido. Confira a internet e tente de novo.';
    S.errInfo=String(code||(e&&e.message)||e||'erro').slice(0,140);
    S.waFallback=!!waNumber(siteCfg().fone);
    render(true);const el=$('.err');if(el)el.scrollIntoView({block:'center'});
  }
}

  cat:el=>{S.cat=el.dataset.id;const sec=document.getElementById('c-'+el.dataset.id);document.querySelectorAll('.cats .chip').forEach(c=>c.setAttribute('aria-pressed',String(c===el)));if(sec)sec.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})},
  item:el=>{if(!isOpen())return;openSheet({type:'item',id:el.dataset.id,qty:1,adds:[],note:''})},
  quick:el=>{const id=el.dataset.id,m=S.menu[id];if(!m||!isOpen())return;if(addsFor(m.cat).length){A.item(el);return}if(addToBag(id,1,[],'')){toast(m.name+' na sacola.');render(true)}},
  close:()=>closeSheet(),
  qm:()=>{const s=S.sheet;if(s.qty>1){s.qty--;renderSheet()}},
  qp:()=>{const s=S.sheet;if(s.qty<maxMore(s.id)){s.qty++;renderSheet()}},
  addbag:()=>{const s=S.sheet,m=S.menu[s.id];const n=$('#itNote');if(n)s.note=n.value;if(addToBag(s.id,s.qty,s.adds,s.note)){closeSheet();toast(s.qty+'× '+m.name+' na sacola.');render(true)}},
  bag:()=>openSheet({type:'bag'}),
  lm:el=>{const l=S.bag.find(x=>x.k===el.dataset.k);if(!l)return;if(l.qty>1)l.qty--;else S.bag=S.bag.filter(x=>x!==l);saveBag();render(true);if(!S.bag.length)closeSheet();else renderSheet()},
  lp:el=>{const l=S.bag.find(x=>x.k===el.dataset.k);if(!l)return;if(maxMore(l.item,l.k)>l.qty){l.qty++;saveBag();render(true);renderSheet()}},
  checkout:()=>{const p=bagProblem();if(p){toast(p);return}S.sheet=null;renderSheet();clearErr();S.bad={};if(!S.form.pay)S.form.pay=payList().length===1?payList()[0]:'';if(!siteCfg().retirada)S.form.tipo='entrega';S.view='checkout';try{history.replaceState({v:'checkout'},'')}catch(e){}render(true);window.scrollTo(0,0)},
  tomenu:()=>{if(S.view==='checkout'||S.view==='status'){S.view='menu';try{history.replaceState({v:'menu'},'')}catch(e){}render(true);window.scrollTo(0,0)}},
  status:()=>go('status'),
  tipo:el=>{S.form.tipo=el.dataset.v;clearErr();render(true)},
  pay:el=>{S.form.pay=el.dataset.v;clearErr();render(true)},
  send:()=>{S.sendTap=Date.now();submitOrder()},
  editcli:()=>{S.editCli=true;render(true);const e=document.getElementById(S.form.tipo==='retirada'?'cNome':'cEnd');if(e)e.focus()},
  neworder:()=>{forgetOrder();S.view='menu';render(true);window.scrollTo(0,0)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.add&&S.sheet&&S.sheet.type==='item'){const s=S.sheet,id=t.dataset.add;s.adds=s.adds.filter(x=>x!==id);if(t.checked)s.adds.push(id);const g=$('#itGo');if(g)g.textContent='Adicionar · '+brl(itemUnit()*s.qty)}});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.f;
  if(t.id==='itNote'&&S.sheet){S.sheet.note=t.value;return}
  if(!k)return;
  if(k==='fone'){const v=fmtFone(t.value);if(v!==t.value)t.value=v}
  S.form[k]=t.value;if(S.bad[k]){delete S.bad[k];t.removeAttribute('aria-invalid')}
});
document.addEventListener('submit',e=>{if(e.target.id==='ckForm'){e.preventDefault();submitOrder()}});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(S.pend)render()},60)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet()});
function showCrash(x){
  try{const m=String((x&&(x.code||x.message))||x||'').slice(0,140);if(!m||m==='Script error.'||S.view!=='checkout'||S.sending||Date.now()-(S.sendTap||0)>15000)return;
    S.sending=false;S.formErr='Algo deu errado ao enviar. Tente de novo.';S.errInfo=m;S.waFallback=!!waNumber(siteCfg().fone);render(true)}catch(_){}
}
window.addEventListener('error',e=>showCrash(e.error||e.message));
window.addEventListener('unhandledrejection',e=>showCrash(e.reason));
window.addEventListener('popstate',e=>{
  if(S.sheet){S.sheet=null;renderSheet();return}
  const v=(e.state&&e.state.v)||'menu';S.view=(v==='status'&&!S.orderId)||(v==='checkout'&&!bagQty())?'menu':v;render(true);
});
try{history.replaceState({v:'menu'},'')}catch(e){}
boot();
})();
</script>
</body>
</html>
