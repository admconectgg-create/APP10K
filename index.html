<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Comandas, telas da churrasqueira e da cozinha, delivery e faturamento.">
<meta name="theme-color" content="#F1F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E121A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salão PDV">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Salão PDV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de celular por perfil. Entrada com login por PIN; garçom vê o salão (mapa 3D, planta ou lista); telas fixas da churrasqueira e da cozinha; gerente com abas Salão, Delivery, Telas e Gerência. */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface-2:#E4E8F0; --ink:#121826; --muted:#5A6478; --line:#D3D9E4;
  --accent:#2952CC; --on-accent:#FFFFFF; --occ:#E3EAFB;
  --ok:#167A45; --ok-soft:#D9F2E3; --warn:#A55A00; --warn-soft:#FCE8CC; --late:#B42318; --late-soft:#FDE0DC;
  --dlv:#0E7490; --dlv-soft:#D3EEF4;
  --floor:#E3E7EE; --grid:rgba(18,24,38,.055); --wall:#A9B3C5; --wall-top:#CBD2DE; --chair:#BAC3D3; --zone:#D5DBE5; --zone-side:#AFB9C9; --ember:#E8590C;
  --paper:#FBFAF5; --toast-act:#9DB6FF;
  --bar:#2952CC; --tint-esp:#FBE6D9; --tint-jan:#FAEFD3; --tint-por:#E7F0DC; --tint-beb:#DCEDF8;
  --av1:#E3EAFB; --av1f:#2952CC; --av2:#DDF3E6; --av2f:#1D7A45; --av3:#FCE8CC; --av3f:#9A5200; --av4:#F3E1F7; --av4f:#8A2BA0; --av5:#FBE0DE; --av5f:#B3261E; --av6:#DCF1F4; --av6f:#0E6E7E;
  --shadow:0 1px 2px rgba(18,24,38,.07),0 6px 18px rgba(18,24,38,.08);
  --f-display:Sora,"Segoe UI",system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --tabs-h:64px; --lift:76px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E121A; --surface:#161C27; --surface-2:#1E2533; --ink:#E6EAF2; --muted:#949DB0; --line:#2A3242;
    --accent:#7C9BFF; --on-accent:#0B1430; --occ:#1C2744;
    --ok:#4ADE80; --ok-soft:#12301E; --warn:#F5A524; --warn-soft:#33240D; --late:#FF7A6E; --late-soft:#3A1714;
    --dlv:#38BDF8; --dlv-soft:#0F2A36;
    --floor:#1A2131; --grid:rgba(255,255,255,.045); --wall:#2B3548; --wall-top:#3D485F; --chair:#3A455B; --zone:#242D3F; --zone-side:#11161F; --ember:#FF8A3D;
    --paper:#1A202B; --toast-act:#2952CC;
  --bar:#6A8BF5; --tint-esp:#3D3431; --tint-jan:#3A3626; --tint-por:#2C3427; --tint-beb:#22303B;
  --av1:#1C2744; --av1f:#9DB6FF; --av2:#173226; --av2f:#7BD7A0; --av3:#33240D; --av3f:#F5B35A; --av4:#2E1C36; --av4f:#DDA2F0; --av5:#3A1A19; --av5f:#FF9A92; --av6:#13303A; --av6f:#7FD3E0;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E121A; --surface:#161C27; --surface-2:#1E2533; --ink:#E6EAF2; --muted:#949DB0; --line:#2A3242;
  --accent:#7C9BFF; --on-accent:#0B1430; --occ:#1C2744;
  --ok:#4ADE80; --ok-soft:#12301E; --warn:#F5A524; --warn-soft:#33240D; --late:#FF7A6E; --late-soft:#3A1714;
  --dlv:#38BDF8; --dlv-soft:#0F2A36;
  --floor:#1A2131; --grid:rgba(255,255,255,.045); --wall:#2B3548; --wall-top:#3D485F; --chair:#3A455B; --zone:#242D3F; --zone-side:#11161F; --ember:#FF8A3D;
  --paper:#1A202B; --toast-act:#2952CC;
  --bar:#6A8BF5; --tint-esp:#3D3431; --tint-jan:#3A3626; --tint-por:#2C3427; --tint-beb:#22303B;
  --av1:#1C2744; --av1f:#9DB6FF; --av2:#173226; --av2f:#7BD7A0; --av3:#33240D; --av3f:#F5B35A; --av4:#2E1C36; --av4f:#DDA2F0; --av5:#3A1A19; --av5f:#FF9A92; --av6:#13303A; --av6f:#7FD3E0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--f-body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto}
#view{padding-bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px) + 28px)}
#app[data-tabs="0"] #view{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
#app[data-tabs="0"]{--lift:16px}
#app[data-view="mesa"] #view,#app[data-view="dnew"] #view{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
#app[data-view="mesa"],#app[data-view="dnew"]{--lift:100px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{margin:0;min-width:0;font:700 clamp(21px,5.6vw,26px)/1.1 var(--f-display);letter-spacing:-.02em;overflow-wrap:anywhere}
.brand small{display:block;margin-top:3px;font:500 13px/1.3 var(--f-body);letter-spacing:0;color:var(--muted)}
.eyebrow{margin:0 0 4px;font:500 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.me{display:flex;align-items:center;gap:10px}
.me .lnk{min-height:28px;padding:0;font-size:13px}
.out{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13.5px var(--f-body);white-space:nowrap}
.out svg{flex:none}
.onb{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--occ);margin:0 0 14px}
.onb>div{min-width:0;flex:1 1 220px}
.onb b{color:var(--accent);font-size:15.5px}
.onb p{margin:4px 0 0;font-size:14px;color:var(--muted);max-width:62ch}
.emptyg{padding:14px 16px}
.emptyg p{margin:0}
.emptyg p+p{margin-top:4px}
.role{font:500 11.5px var(--f-mono);letter-spacing:.04em;padding:4px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role.mgr{background:var(--accent);color:var(--on-accent)}
.sync{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font:500 12px var(--f-body);color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync[data-s="saving"] i{background:var(--warn)}
.sync[data-s="offline"] i,.sync[data-s="error"] i{background:var(--late)}
.sync[data-s="local"] i{background:var(--muted)}

.note{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:12px;background:var(--surface-2);font-size:13.5px;margin:0 0 12px;color:var(--ink)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);display:grid;gap:12px;justify-items:center}
.h2{margin:24px 0 8px;font:500 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;font:600 11.5px var(--f-body);letter-spacing:.02em;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.late{background:var(--late-soft);color:var(--late)}
.badge.acc{background:var(--occ);color:var(--accent)}
.badge.dlv{background:var(--dlv-soft);color:var(--dlv)}
.hint{margin:2px 0 0;font-size:13px;color:var(--muted)}

.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.okb{background:var(--ok);color:var(--surface);border-color:transparent}
.btn.danger{color:var(--late)}
.btn.big{min-height:52px;padding:0 22px;font-size:16px}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px}
.btn:disabled{opacity:.45}
.lnk{border:0;background:transparent;color:var(--accent);font-weight:600;padding:6px 0;min-height:36px}
.lnk.danger{color:var(--late)}
.x,.back,.sq{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.sq:disabled{opacity:.35}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.row .btn{flex:1}
.row.end{justify-content:flex-end}
.row.end .btn{flex:0 1 auto}

/* Entrada */
.login{max-width:560px;margin:0 auto;padding-block:32px 40px}
.lhead{text-align:center;margin-bottom:8px}
.lhead .brand{font-size:clamp(26px,7vw,34px)}
.lead{margin:8px auto 0;max-width:46ch;color:var(--muted)}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:10px}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 18px var(--f-display);background:var(--occ);color:var(--accent)}
.pinpad{max-width:340px;margin:0 auto;display:grid;gap:14px;justify-items:center;text-align:center}
.pinpad .av{width:72px;height:72px;font-size:29px}
.pname{margin:0;font:700 24px var(--f-display);overflow-wrap:anywhere}
.dots{display:flex;gap:12px;min-height:16px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,84px));gap:12px;width:100%;justify-content:center}
.key{display:grid;place-items:center;height:66px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font:600 26px var(--f-display)}
.key:active{background:var(--occ)}
.key.ghost{border:0;background:transparent}
.av.c1{background:var(--av1);color:var(--av1f)}.av.c2{background:var(--av2);color:var(--av2f)}.av.c3{background:var(--av3);color:var(--av3f)}
.av.c4{background:var(--av4);color:var(--av4f)}.av.c5{background:var(--av5);color:var(--av5f)}.av.c6{background:var(--av6);color:var(--av6f)}
.av.mg{background:var(--accent);color:var(--on-accent)}
.who2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,100%),1fr));gap:10px}
.ptile{display:grid;justify-items:center;align-content:center;gap:8px;min-width:0;min-height:132px;padding:14px 10px;border-radius:18px;border:1px solid var(--line);background:var(--surface);text-align:center}
.ptile:active,.last:active{transform:scale(.98)}
.ptile .av{width:58px;height:58px;font-size:23px}
.ptile b{font:600 17px/1.2 var(--f-display);overflow-wrap:anywhere}
.ptile small{display:inline-flex;align-items:center;gap:4px;margin-top:-4px;font-size:12.5px;font-weight:600;color:var(--accent)}
.ptile small svg{width:13px;height:13px}
.last{display:flex;align-items:center;gap:14px;width:100%;margin-top:18px;padding:16px;border-radius:20px;border:2px solid var(--accent);background:var(--surface);text-align:left}
.last .av{width:62px;height:62px;font-size:25px}
.last-t{flex:1;min-width:0;display:grid;gap:1px}
.last-t b{font:700 21px/1.2 var(--f-display);overflow-wrap:anywhere}
.last-t small{font-size:13px;color:var(--muted)}
.last>svg{flex:none;color:var(--accent)}
.scrrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scrbtn{display:flex;align-items:center;gap:10px;min-width:0;min-height:54px;padding:8px 14px;border-radius:14px;border:1px dashed var(--line);background:transparent;font-weight:600;text-align:left}
.scrbtn svg{flex:none;color:var(--muted)}
.pinpad{position:relative}
.pinback{position:absolute;top:-6px;left:0}
@keyframes pinshake{0%,100%{transform:none}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.dots.bad{animation:pinshake .4s}
.dots.bad i{border-color:var(--late)}
@media (prefers-reduced-motion:reduce){.dots.bad{animation:none}}
.key.fn{font:600 13px var(--f-body);color:var(--muted)}
.key.go{background:var(--accent);color:var(--on-accent);border-color:transparent;font:600 15px var(--f-body)}
.key:disabled{opacity:.4}
.setup{max-width:420px;margin:18px auto 0}
.steps{margin:12px 0 0;padding-left:22px;display:grid;gap:10px;font-size:14px}
.steps li::marker{font-weight:700;color:var(--accent)}
.bigcode{margin:8px 0;font:700 54px/1 var(--f-mono);letter-spacing:.12em;color:var(--accent)}
.dev{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dev:last-child{border-bottom:0}
.dev-i{min-width:0}
.dev-i b{display:block;overflow-wrap:anywhere}
.dev-i small{color:var(--muted);font-size:13px}
.dev-a{display:flex;gap:8px}
.code{font:600 14px var(--f-mono);color:var(--ink);letter-spacing:.08em}
.qr{margin-top:14px;display:grid;justify-items:center}
.qr img{width:220px;height:220px;max-width:100%;background:#fff;border-radius:8px;image-rendering:pixelated}
.btn.alink{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}

/* Salão */
.sum4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:4px 0 14px}
@media (max-width:560px){.sum4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum4>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.sum4 b{display:block;font:700 21px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.sum4 b small{font:500 14px var(--f-body);color:var(--muted)}
.sum4 span{font-size:12.5px;color:var(--muted)}
.mapbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 12px}
.vseg{display:inline-grid;grid-auto-flow:column;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.vseg button{min-height:38px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted)}
.vseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.attn{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.achip{min-height:38px;padding:0 12px;border-radius:10px;border:0;font-weight:600;font-size:13.5px}
.achip.ok{background:var(--ok-soft);color:var(--ok)}
.achip.warn{background:var(--warn-soft);color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 2px 0;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:4px;border:2px solid}

/* Mapa 3D */
.mapwrap{position:relative;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);padding:12px;overflow:hidden;container-type:inline-size}
.mapwrap.is3d{background:linear-gradient(180deg,var(--surface-2),var(--surface) 70%);padding:4px 10px 10px}
.stage{perspective:1500px;perspective-origin:50% -20%;max-width:900px;margin:0 auto}
.floor{position:relative;width:100%;aspect-ratio:1000/640;border-radius:12px;background-color:var(--floor);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:5% 7.8125%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.stage.d3{margin:calc(-.035*min(100cqw,900px)) auto calc(-.01*min(100cqw,900px))}
.stage.d3 .floor{width:94%;margin-inline:auto}
.stage.d3 .floor{transform:rotateX(50deg);border-radius:3px;box-shadow:0 30px 40px -20px rgba(10,15,30,.35)}
.wall{position:absolute;display:block;pointer-events:none;background:var(--wall)}
.wn{left:0;top:0;width:100%;height:5px}
.ww{left:0;top:0;width:5px;height:100%}
.we{right:0;top:0;width:5px;height:100%}
.stage.d3 .wn{height:34px;transform-origin:50% 0;transform:rotateX(90deg);background:linear-gradient(var(--wall),var(--wall-top))}
.stage.d3 .ww{width:34px;transform-origin:0 50%;transform:rotateY(-90deg);background:linear-gradient(90deg,var(--wall),var(--wall-top))}
.stage.d3 .we{width:34px;transform-origin:100% 50%;transform:rotateY(90deg);background:linear-gradient(90deg,var(--wall-top),var(--wall))}
.zone{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));transform-style:preserve-3d}
.zone-top{position:absolute;inset:0;border-radius:8px;display:grid;place-items:center;background:var(--zone);border:1.5px solid var(--zone-side);color:var(--muted);text-align:center;overflow:hidden;padding:2px;container-type:size}
.zone-top span{display:inline-block;font:600 clamp(7px,26cqh,13px)/1.1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;transform:rotate(var(--lr,0deg))}
.zone.k-grill .zone-top{background:radial-gradient(ellipse at 50% 75%,rgba(232,89,12,.6),rgba(232,89,12,.14) 55%,transparent 78%),repeating-linear-gradient(90deg,var(--zone) 0 7px,var(--zone-side) 7px 9px);border-color:var(--ember);color:var(--ink)}
.zone.k-kitchen .zone-top{background:repeating-conic-gradient(var(--zone) 0 25%,var(--surface-2) 0 50%) 0 0/16px 16px;color:var(--ink)}
.zone.k-counter .zone-top{background:var(--zone-side);color:var(--ink)}
.zone.k-door .zone-top{background:transparent;border:0;border-top:3px dashed var(--muted);border-radius:0;place-items:start center;padding-top:3px}
.zone.k-plain .zone-top{border-style:dashed}
.stage.d3 .zone:not(.k-door) .zone-top{transform:translateZ(12px);box-shadow:calc(var(--sx,0)*9px) calc(var(--sy,1)*9px) 0 var(--zone-side)}
.tb{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));transform-style:preserve-3d;padding:0;border:0;background:transparent;color:inherit}
.stage.d3 .tb{transform:translate(-50%,-50%) translateZ(1px) rotate(var(--r,0deg))}
.tb.round,.tb.round .tb-top,.tb.round::after{border-radius:50%}
.tb.square,.tb.square .tb-top,.tb.square::after{border-radius:16%}
.tb.rect,.tb.rect .tb-top,.tb.rect::after{border-radius:10%/20%}

let seenInit=false;const seen={};
function checkTransitions(){
  const r=role();if(!r)return;
  const myId=session.kind==='staff'?session.id:null;
  let fresh=0;const ready=[];
  orderList().forEach(o=>{
    const prev=seen[o.id],st=o.st||{};
    if(seenInit){
      if(!prev){if(r==='tela'&&st[session.st]==='novo')fresh++}
      else Object.keys(st).forEach(s=>{
        if(st[s]==='pronto'&&prev[s]==='novo'&&!ui.selfReady.has(o.id+':'+s)&&myId&&(o.by===myId||(r==='gerente'&&isDlv(o))))ready.push({o:o,s:s});
      });
    }
    seen[o.id]=Object.assign({},st);
  });
  Object.keys(seen).forEach(id=>{if(!state.orders[id])delete seen[id]});
  seenInit=true;
  if(fresh){beep(2);toast(fresh===1?'Pedido novo chegou.':fresh+' pedidos novos chegaram.')}
  if(ready.length){beep(1);const x=ready[0];toast((isDlv(x.o)?'Delivery #'+x.o.code:'Mesa '+x.o.table)+': '+stName(x.s).toLowerCase()+' pronta'+(ready.length>1?' (+'+(ready.length-1)+')':'')+'.')}
}

  const bar='<div class="mapbar">'+vseg+(isMgr()?'<button class="btn sm" data-act="mapedit">Editar mapa</button>':'')+'</div>';
  const body=ui.mapView==='list'?tilesHtml(infos):mapHtml()+legendHtml()+(orphans.length?'<p class="hint" style="margin-top:8px">Mesas com pedido fora do mapa: '+orphans.map(n=>'<button class="lnk" data-act="open" data-t="'+n+'">'+n+'</button>').join(', ')+'</p>':'');

function stockStrip(st){
  const left=stockLeft(),b=stockBase(),ids=Object.keys(left).filter(id=>{const m=state.menu[id];return m&&(!st||itemStations(m).includes(st))});
  if(!ids.length)return '';
  ids.sort((x,y)=>left[x]-left[y]);
  return '<div class="stk" aria-label="O que resta hoje"><span class="stk-l">Restam</span>'+ids.map(id=>{const m=state.menu[id],l=left[id],c=l<=0?' out':l<=lowLimit(b[id])?' low':'';return '<span class="stk-i'+c+'">'+thumb(Object.assign({id:id},m),'s24')+esc(shortName(m.name))+' <b>'+(l<=0?'acabou':l)+'</b></span>'}).join('')+'</div>';
}

function prepAvg(sales,extraOrders){
  const acc={},add=(st,v)=>{const a=acc[st]||(acc[st]={n:0,sum:0,max:0});a.n++;a.sum+=v;if(v>a.max)a.max=v};
  sales.forEach(s=>{const p=s.prep||{};Object.keys(p).forEach(st=>(p[st]||[]).forEach(v=>add(st,v)))});
  (extraOrders||[]).forEach(o=>{const sa=o.stAt||{};Object.keys(sa).forEach(st=>{const v=Math.round((sa[st]-(o.at||0))/1000);if(v>0&&v<4*3600)add(st,v)})});
  return acc;
}
const fmtMin=sec=>{const m=Math.round(sec/60);return m<1?'menos de 1 min':m+' min'};
function viewTelas(){
  const cols=STATIONS.map(st=>{const l=tickets(st,ui.kTab);return '<section class="tcol" data-st="'+st+'"><div class="tcol-h">'+esc(stName(st))+'<span>'+plural(l.length,'pedido','pedidos')+'</span></div>'+(l.length?l.map(o=>ticketHtml(o,st,true)).join(''):'<p class="hint">Nada esperando.</p>')+'</section>'}).join('');
  const tseg='<div class="seg tseg" role="group" aria-label="Tela">'+STATIONS.map(st=>'<button data-act="telast" data-v="'+st+'" aria-pressed="'+(ui.telaSt===st)+'">'+esc(stName(st))+'<b>'+tickets(st,ui.kTab).length+'</b></button>').join('')+'</div>';
  const pa=state.day===dayKey(Date.now())?prepAvg(Object.keys(state.sales).map(k=>state.sales[k]),orderList()):{};
  const pl=STATIONS.filter(s=>pa[s]&&pa[s].n).map(s=>esc(stName(s))+' '+fmtMin(pa[s].sum/pa[s].n)).join(' · ');
  return head('O que está em cada tela agora')+banner()+stockStrip(null)+(pl?'<p class="hint" style="margin:-4px 0 12px">Tempo médio de preparo hoje: '+pl+'</p>':'')+originTabsAll()+tseg+'<div class="tcols" data-st="'+ui.telaSt+'">'+cols+'</div>'+
   '<p class="hint" style="margin-top:12px">É o mesmo que aparece nos aparelhos da churrasqueira e da cozinha, ao vivo. Pedidos com mais de '+LATE_MIN+' minutos ficam em vermelho.</p>';
}

function weekStart(key){const p=key.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2],12);return shiftDay(key,-((d.getDay()+6)%7))}
function monthRange(key){const p=key.split('-').map(Number),last=new Date(p[0],p[1],0).getDate();return [p[0]+'-'+pad(p[1])+'-01',p[0]+'-'+pad(p[1])+'-'+pad(last)]}
function rpRange(){const ref=ui.rpRef||dayKey(Date.now());if(ui.rp==='semana'){const s=weekStart(ref);return [s,shiftDay(s,6)]}if(ui.rp==='mes')return monthRange(ref);return [state.day,state.day]}
function daysBetween(a,b){const out=[];let d=a;for(let i=0;i<40&&d<=b;i++){out.push(d);d=shiftDay(d,1)}return out}
async function fetchRange(a,b){
  const days=daysBetween(a,b),out={sales:[],voids:[]};
  if(backend.mode==='local'){['sales','voids'].forEach(c=>{Object.keys(local[c]||{}).forEach(id=>{const x=local[c][id];if(x.day>=a&&x.day<=b)out[c].push(Object.assign({id:id},x))})});return out}
  for(let i=0;i<days.length;i+=7){
    const s=days[i],e=days[Math.min(i+6,days.length-1)];
    for(const c of ['sales','voids']){const snap=await backend.db.collection(c).where('day','>=',s).where('day','<=',e).get();snap.docs.forEach(d=>out[c].push(Object.assign({id:d.id},d.data())))}
  }
  return out;
}
function loadReport(){
  const r=rpRange(),key=ui.rp+':'+r[0];
  if(ui.rp==='dia'){ui.rpData=null;return}
  if(ui.rpData&&ui.rpData.key===key)return;
  ui.rpData={key:key,loading:true,sales:[],voids:[]};
  fetchRange(r[0],r[1]).then(d=>{if(!ui.rpData||ui.rpData.key!==key)return;ui.rpData={key:key,loading:false,sales:d.sales,voids:d.voids};render(true)}).catch(()=>{if(ui.rpData&&ui.rpData.key===key){ui.rpData={key:key,loading:false,err:true,sales:[],voids:[]};render(true)}});
}
const MONTHS=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function periodLabel(){
  const r=rpRange();
  if(ui.rp==='dia')return dayLabel(state.day);
  const f=k=>{const p=k.split('-').map(Number);return p[2]+' '+MO[p[1]-1]};
  if(ui.rp==='semana')return f(r[0])+' a '+f(r[1]);
  const p=r[0].split('-').map(Number);return MONTHS[p[1]-1]+' de '+p[0];
}
const salePays=s=>Array.isArray(s.payments)&&s.payments.length?s.payments:[{a:s.total,m:s.method}];
function payRows(sales){const byM={};sales.forEach(s=>salePays(s).forEach(p=>{byM[p.m]=(byM[p.m]||0)+(+p.a||0)}));return byM}
function payText2(s){const ps=salePays(s);if(ps.length<2)return methodName(ps[0].m);return ps.map(p=>methodName(p.m)+' '+brl(p.a)).join(' + ')}
function dayChart(sales,r){
  const days=daysBetween(r[0],r[1]),tot={},cnt={};sales.forEach(s=>{tot[s.day]=(tot[s.day]||0)+(s.total||0);cnt[s.day]=(cnt[s.day]||0)+1});
  const vals=days.map(d=>tot[d]||0),max=Math.max(0,...vals);
  if(!max)return '';
  const wk=days.length<=7,bi=vals.indexOf(max),lab=d=>dayLabel(d).replace('Hoje · ','hoje, ');
  const tip=i=>lab(days[i])+' · '+brl(vals[i])+(cnt[days[i]]?' · '+plural(cnt[days[i]],'venda','vendas'):'');
  const cols=days.map((d,i)=>{const v=vals[i],p=d.split('-').map(Number),dt=new Date(p[0],p[1]-1,p[2],12);
    return '<button class="dch-c'+(i===bi?' on':'')+'" data-act="dchpick" data-tip="'+esc(tip(i))+'" aria-label="'+esc(tip(i))+'"><span class="dch-w"><span class="dch-b" style="height:'+(v?Math.max(2,Math.round(v/max*100)):0)+'%"></span></span><span class="dch-x">'+(wk?WK[dt.getDay()]:((p[2]===1||p[2]%5===0)?p[2]:''))+'</span></button>'}).join('');
  const rows=days.map((d,i)=>vals[i]?'<li><span>'+esc(lab(d))+'<small>'+plural(cnt[d]||0,'venda','vendas')+'</small></span><b>'+brl(vals[i])+'</b></li>':'').join('');
  return '<h2 class="h2">Por dia</h2><div class="card"><p class="dch-cap" id="dchCap" aria-live="polite">Melhor dia: '+esc(tip(bi))+'</p><div class="dch" style="--n:'+days.length+'">'+cols+'</div><details class="dd"'+(ui.ddOpen?' open':'')+'><summary>Ver dia a dia</summary><ul class="list">'+rows+'</ul></details></div>';
}

function gVendas(){

  const exp=n?'<div class="row" style="margin-top:12px"><button class="btn sm ib" data-act="csv">'+ICON.down+'Baixar planilha (CSV)</button></div>':'';

let lastKey='',raf=0,drag=null;

const hashName=()=>{try{return (location.hash||'').slice(1)}catch(e){return ''}};
function render(force){
  const view=$('#view'),ae=document.activeElement;
  if(!force&&(drag||(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&view.contains(ae)))){state.pend=true;paintChrome();return}
  state.pend=false;
  validateSession();
  if(isReady()&&session&&role())checkTransitions();
  let html;
  if(backend.mode==='nocfg'){ui.view='login';html=viewNoConfig()}
  else if(backend.mode==='fberr'){ui.view='login';html=viewFbError()}
  else if(backend.mode==='fire'&&(backend.access!=='ok'||ui.ownerLogin)){ui.view='login';html=viewAccess()}
  else if(backend.mode==='boot'||!isReady())html=viewLoading();
  else if(!staffList().length){ui.view='setup';html=viewSetup()}
  else if(!session||!role()){ui.view='login';html=viewLogin()}
  else{
    if(['boot','login','setup'].includes(ui.view))apply(hashName()||home());
    else if(!ALLOWED[role()].includes(ui.view)||(ui.view==='mesa'&&!tableExists(ui.table)))apply(home());
    const v=ui.view;
    html=v==='mesa'?viewMesa():v==='delivery'?viewDelivery():v==='dnew'?viewDNew():v==='telas'?viewTelas():v==='gerencia'?viewGerencia():v==='tela'?viewTela():viewSalao();
  }
  const key=ui.view+':'+ui.table+':'+ui.pane+':'+ui.gsub+':'+ui.mapEdit;
  const y=window.scrollY,keep=[].map.call(view.querySelectorAll('[data-keep]'),e=>e.scrollLeft);
  view.innerHTML=html;
  view.querySelectorAll('[data-keep]').forEach((e,i)=>{if(keep[i]!=null)e.scrollLeft=keep[i]});
  window.scrollTo(0,key===lastKey?y:0);lastKey=key;
  paintChrome();
  if(!IS_ARTIFACT&&isReady()&&state.config&&state.config.name&&document.title!==state.config.name)document.title=state.config.name;

let pubT=null,pubSig='';

function pubStockSoon(){
  if(backend.mode!=='fire'||!me.owner||backend.stockDenied||pubT||!isReady())return;
  if(!Object.keys(stockBase()).length)return;
  const want=normLeft(stockLeft());
  if(want===pubSig||want===normLeft(state.stock.left))return;
  pubT=setTimeout(()=>{pubT=null;if(!Object.keys(stockBase()).length)return;const l=stockLeft(),w=normLeft(l);if(w===pubSig||w===normLeft(state.stock.left))return;pubSig=w;upd('stock',stockDay,{left:l})},1500);
}

  const sp=document.createElement('span');sp.textContent=msg;el.appendChild(sp);
  if(act){const b=document.createElement('button');b.textContent=act.label;b.addEventListener('click',()=>{el.remove();act.fn()});el.appendChild(b)}

let dragEl=null;
document.addEventListener('pointerdown',e=>{
  if(!ui.mapEdit)return;
  const fl=$('#floor');if(!fl)return;
  const rh=e.target.closest('[data-rot]');
  if(rh){e.preventDefault();drag={mode:'rot',kind:rh.dataset.rot,idx:+rh.dataset.idx,moved:true,fl:fl};dragEl=rh.closest('.tb,.zone');try{rh.setPointerCapture(e.pointerId)}catch(x){}return}
  const el=e.target.closest('[data-drag]');if(!el)return;
  e.preventDefault();
  drag={mode:'move',kind:el.dataset.drag,idx:+el.dataset.idx,x0:e.clientX,y0:e.clientY,moved:false,fl:fl};dragEl=el;
  try{el.setPointerCapture(e.pointerId)}catch(x){}
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(drag.mode==='rot'){
    const r=drag.fl.getBoundingClientRect(),o=drag.kind==='t'?ui.layoutDraft.tables[drag.idx]:ui.layoutDraft.zones[drag.idx];if(!o||!dragEl)return;
    const cx=r.left+o.x/100*r.width,cy=r.top+o.y/100*r.height;
    const a=normDeg(Math.round((Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI+90)/15)*15);
    if(a!==normDeg(o.r)){o.r=a;applyRot(dragEl,o,drag.kind==='z');setT('mapAng',a+'°')}
    return;
  }
  if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<5)return;
  drag.moved=true;
  const r=drag.fl.getBoundingClientRect(),o=drag.kind==='t'?ui.layoutDraft.tables[drag.idx]:ui.layoutDraft.zones[drag.idx];if(!o)return;
  o.x=Math.round(clamp((e.clientX-r.left)/r.width*100,3,97)*2)/2;o.y=Math.round(clamp((e.clientY-r.top)/r.height*100,3,98)*2)/2;
  dragEl.style.left=o.x+'%';dragEl.style.top=o.y+'%';
});

function readPhoto(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type||'image/')){rej(new Error('tipo'));return}
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      try{
        const S=176,c=document.createElement('canvas');c.width=S;c.height=S;
        const g=c.getContext('2d'),w=img.naturalWidth,h=img.naturalHeight,s=Math.min(w,h);
        g.fillStyle='#fff';g.fillRect(0,0,S,S);g.drawImage(img,(w-s)/2,(h-s)/2,s,s,0,0,S,S);URL.revokeObjectURL(url);
        let q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>45000&&q>.4){q-=.12;d=c.toDataURL('image/jpeg',q)}
        res(d);
      }catch(e){rej(e)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};
    img.src=url;
  });
}
function salesCsv(sales){
  const H=['Data','Hora','Tipo','Mesa ou pedido','Cliente','Itens','Subtotal','Serviço','Desconto','Taxa de entrega','Total','Pagamento','Garçom'];
  const n=c=>((c||0)/100).toFixed(2).replace('.',',');
  const q=v=>{v=String(v==null?'':v);return /[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=sales.slice().sort((a,b)=>a.closedAt-b.closedAt).map(s=>{
    const d=new Date(s.closedAt||Date.now());
    return [pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(),hm(s.closedAt||Date.now()),s.kind==='delivery'?'Delivery':'Salão',s.kind==='delivery'?'#'+s.code:'Mesa '+s.table,s.cliente||'',
      (s.lines||[]).map(l=>l.qty+'x '+l.name+(l.adds&&l.adds.length?' '+addsText(l.adds):'')+(l.note?' ('+l.note+')':'')).join(' | '),
      n(s.subtotal),n(s.service),n(s.discount),n(s.fee),n(s.total),salePays(s).map(p=>methodName(p.m)+' '+n(p.a)).join(' + '),Object.keys(s.by||{}).map(nameOf).join(', ')];
  });
  return '﻿'+[H].concat(rows).map(r=>r.map(q).join(';')).join('\r\n');
}

    let d=null;try{d=await window.claude.use('downloads')}catch(e){}

    return;
  }

}

async function wipe(full,onProgress){
  const colls=['orders','tables','sales','voids','stocklog','stock','online'].concat(full?['menu','staff','layout','config']:[]);
  let done=0;
  if(backend.mode==='local'){colls.forEach(c=>{done+=Object.keys(local[c]||{}).length;local[c]={}});persistLocal();return done}
  if(!isCloud()||!backend.db)return 0;
  for(const c of colls){
    let lastFirst=null;
    for(let round=0;round<60;round++){
      let snap;try{snap=await backend.db.collection(c).limit(400).get()}catch(e){break}
      if(!snap.docs.length||snap.docs[0].id===lastFirst)break;
      lastFirst=snap.docs[0].id;
      const ids=snap.docs.map(d=>d.id);
      for(let i=0;i<ids.length;i+=4){
        const chunk=ids.slice(i,i+4);
        await Promise.all(chunk.map(id=>backend.db.doc(c+'/'+id).delete().catch(()=>{})));
        done+=chunk.length;onProgress(done);
      }
    }
  }
  return done;
}

function onlineCalc(o){
  const items=[],miss=[];
  (Array.isArray(o.items)?o.items:[]).slice(0,40).forEach(i=>{
    const m=i&&state.menu[i.item];
    if(!m){miss.push(String((i&&i.name)||'item').slice(0,40)+' (saiu do cardápio)');return}
    if(m.on===false)miss.push(m.name+' (acabou)');
    const want=Array.isArray(i.adds)?i.adds.map(a=>a&&a.id):[];
    const ad=addsFor(m.cat).filter(a=>want.includes(a.id)).map(a=>({id:a.id,name:a.name,cents:a.cents}));
    const it={item:i.item,name:m.name,cents:m.cents+ad.reduce((t,a)=>t+a.cents,0),qty:Math.max(1,Math.min(50,parseInt(i.qty,10)||1)),note:String(i.note||'').slice(0,60),cat:m.cat||'',st:itemStations(m).slice()};
    if(ad.length){it.adds=ad;it.base=m.cents}
    items.push(it);
  });
  const ret=o.tipo==='retirada',sub=items.reduce((t,i)=>t+i.cents*i.qty,0),fee=ret?0:(state.config.deliveryFee||0);
  return {items:items,miss:miss,sub:sub,fee:fee,total:sub+fee,ret:ret,diff:(+o.total||0)!==sub+fee};
}
function onOnline(m){

const RULES="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    function signedIn() { return request.auth != null; }\n    function isOwner() {\n      return signedIn()\n        && exists(/databases/$(database)/documents/meta/owner)\n        && get(/databases/$(database)/documents/meta/owner).data.uid == request.auth.uid;\n    }\n    function isDevice() {\n      return signedIn()\n        && exists(/databases/$(database)/documents/devices/$(request.auth.uid))\n        && get(/databases/$(database)/documents/devices/$(request.auth.uid)).data.ok == true;\n    }\n    function isTeam() { return isOwner() || isDevice(); }\n    function siteOpen() {\n      return exists(/databases/$(database)/documents/config/main)\n        && get(/databases/$(database)/documents/config/main).data.get('site', {}).get('open', false) == true;\n    }\n    function okOrder(d) {\n      return d.keys().hasOnly(['uid','status','at','day','tipo','nome','fone','end','bairro','ref','obs','pay','troco','items','sub','fee','total'])\n        && d.uid == request.auth.uid\n        && d.status == 'novo'\n        && d.tipo in ['entrega','retirada']\n        && d.nome is string && d.nome.size() > 0 && d.nome.size() <= 60\n        && d.fone is string && d.fone.size() <= 30\n        && d.end is string && d.end.size() <= 140\n        && d.get('bairro', '') is string && d.get('bairro', '').size() <= 60\n        && d.get('ref', '') is string && d.get('ref', '').size() <= 100\n        && d.get('obs', '') is string && d.get('obs', '').size() <= 100\n        && d.pay in ['din', 'pix', 'car']\n        && d.get('troco', 0) is number && d.get('sub', 0) is number && d.get('fee', 0) is number && d.get('total', 0) is number\n        && d.items is list && d.items.size() > 0 && d.items.size() <= 40;\n    }\n\n    // Quem é o dono: criado uma única vez, pela conta de e-mail e senha do dono.\n    match /meta/owner {\n      allow read: if signedIn();\n      allow create: if signedIn()\n        && request.auth.token.firebase.sign_in_provider == 'password'\n        && request.resource.data.uid == request.auth.uid;\n      allow update, delete: if false;\n    }\n\n    // Aparelhos da equipe: cada um pede acesso e só o dono libera.\n    match /devices/{uid} {\n      allow read: if signedIn() && (request.auth.uid == uid || isOwner());\n      allow create: if signedIn() && request.auth.uid == uid && request.resource.data.ok == false;\n      allow update, delete: if isOwner();\n    }\n\n    // Cardápio e ajustes: qualquer pessoa vê (o site de pedidos usa), só o dono muda.\n    match /menu/{id}   { allow read: if true; allow write: if isOwner(); }\n    match /config/{id} { allow read: if true; allow write: if isOwner(); }\n\n    // Mapa e logins: a equipe lê, só o dono muda.\n    match /layout/{id} { allow read: if isTeam(); allow write: if isOwner(); }\n    match /staff/{id}  { allow read: if isTeam(); allow write: if isOwner(); }\n\n    // Pedidos e mesas: toda a equipe liberada lê e lança.\n    match /orders/{id} { allow read, write: if isTeam(); }\n    match /tables/{id} { allow read, write: if isTeam(); }\n\n    // Controle de espetos: todos veem o que resta (o site marca \"esgotado\"), a equipe dá baixa, só o dono define as quantidades.\n    match /stock/{id}    { allow read: if true; allow write: if isOwner(); }\n    match /stocklog/{id} { allow read, create: if isTeam(); allow update, delete: if isOwner(); }\n\n    // Pedidos do site: o cliente cria o pedido com o site aberto e acompanha só o dele; o dono aceita ou recusa.\n    match /online/{id} {\n      allow create: if signedIn() && siteOpen() && okOrder(request.resource.data);\n      allow read: if isTeam() || (signedIn() && resource.data.uid == request.auth.uid);\n      allow update, delete: if isOwner();\n    }\n\n    // Faturamento e cancelamentos: só o dono.\n    match /sales/{id}  { allow read, write: if isOwner(); }\n    match /voids/{id}  { allow read, write: if isOwner(); }\n  }\n}\n";
const CFG_KEYS=['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'];
function b64e(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
function parseCfg(t){
  t=String(t||'').trim();if(!t)return null;
  const m=t.match(/convite=([A-Za-z0-9_\-]+)/);
  if(m){try{t=b64d(m[1])}catch(e){return null}}
  else if(/^[A-Za-z0-9_\-]{60,}$/.test(t)){try{t=b64d(t)}catch(e){}}
  const o={};
  CFG_KEYS.forEach(k=>{const x=t.match(new RegExp('["\']?'+k+'["\']?\\s*:\\s*["\']([^"\'\\s]+)["\']'));if(x)o[k]=x[1]});
  return o.apiKey&&o.projectId&&o.appId?o:null;
}
function getFbConfig(){
  if(window.SALAO_CONFIG&&window.SALAO_CONFIG.apiKey)return window.SALAO_CONFIG;
  const h=location.hash||'';
  if(h.indexOf('convite=')>=0){
    const c=parseCfg(h);
    if(c){lsSet(LS.cfg,JSON.stringify(c));lsSet(LS.demo,null)}
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    if(c)return c;
  }
  try{const r=lsGet(LS.cfg);return r?JSON.parse(r):null}catch(e){return null}
}
function inviteUrl(){const c=backend.cfg||{},o={};CFG_KEYS.forEach(k=>{if(c[k])o[k]=c[k]});return location.href.split('#')[0]+'#convite='+b64e(JSON.stringify(o))}
async function initFirebase(cfg){
  const B='https://www.gstatic.com/firebasejs/'+FB_V+'/';
  const r=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  const A=r[0],AU=r[1],FS=r[2],app=A.initializeApp(cfg);
  let fdb;
  try{fdb=FS.initializeFirestore(app,{localCache:FS.persistentLocalCache({tabManager:FS.persistentMultipleTabManager()})})}catch(e){fdb=FS.getFirestore(app)}
  return {A:A,AU:AU,FS:FS,app:app,fdb:fdb,auth:AU.getAuth(app)};
}
/* o resto do app fala com o banco pela mesma interface da versão no Claude */
function flatPatch(o,pre,out){out=out||{};Object.keys(o).forEach(k=>{const v=o[k],p=pre?pre+'.'+k:k;if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length)flatPatch(v,p,out);else out[p]=v});return out}
const cleanData=d=>JSON.parse(JSON.stringify(d));
function mapErr(e){
  const c=(e&&e.code)||'';
  const m={'permission-denied':'invalid_argument','not-found':'invalid_argument','invalid-argument':'invalid_argument','failed-precondition':'invalid_argument','unavailable':'unavailable','deadline-exceeded':'unavailable','resource-exhausted':'quota_exceeded','unauthenticated':'invalid_argument'};
  return {code:m[c]||(c==='invalid_argument'||c==='unavailable'?c:'unavailable'),gone:c==='not-found',fb:c,message:(e&&e.message)||''};
}
function wrapSnap(s){const md=s.metadata||{};return {id:s.id,exists:typeof s.exists==='function'?s.exists():!!s.exists,data:()=>s.data(),metadata:{fromCache:!!md.fromCache,hasPendingWrites:!!md.hasPendingWrites}}}
function makeDb(F){
  const FS=F.FS,fdb=F.fdb,rej=e=>{throw mapErr(e)};
  const ref=path=>({
    path:path,
    get:()=>FS.getDoc(FS.doc(fdb,path)).then(wrapSnap,rej),
    set:d=>FS.setDoc(FS.doc(fdb,path),cleanData(d)).catch(rej),
    update:d=>FS.updateDoc(FS.doc(fdb,path),flatPatch(cleanData(d))).catch(rej),
    delete:()=>FS.deleteDoc(FS.doc(fdb,path)).catch(rej),
    onSnapshot:(next,err)=>FS.onSnapshot(FS.doc(fdb,path),s=>next(wrapSnap(s)),e=>{if(err)err(mapErr(e))})
  });
  const q=(path,cons)=>({
    path:path,
    where:(f,op,v)=>q(path,cons.concat([FS.where(f,op,v)])),
    limit:n=>q(path,cons.concat([FS.limit(n)])),
    get:()=>{const base=FS.collection(fdb,path),target=cons.length?FS.query.apply(null,[base].concat(cons)):base;return FS.getDocs(target).then(s=>({docs:s.docs.map(wrapSnap),size:s.size,empty:s.empty}),rej)},
    onSnapshot:(next,err)=>{
      const base=FS.collection(fdb,path),target=cons.length?FS.query.apply(null,[base].concat(cons)):base;
      return FS.onSnapshot(target,s=>{const md=s.metadata||{};next({docs:s.docs.map(wrapSnap),size:s.size,empty:s.empty,metadata:{fromCache:!!md.fromCache,hasPendingWrites:!!md.hasPendingWrites}})},e=>{if(err)err(mapErr(e))});
    }
  });
  return {doc:ref,collection:p=>q(p,[])};
}
function authMsg(e){
  const c=(e&&e.code)||'';
  return ({
    'auth/invalid-email':'E-mail inválido.','auth/missing-password':'Digite a senha.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.',
    'auth/email-already-in-use':'Esse e-mail já tem conta. Toque em "Já criei, quero entrar".',
    'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.',
    'auth/too-many-requests':'Muitas tentativas. Espere um pouco e tente de novo.','auth/network-request-failed':'Sem internet. Confira a conexão e tente de novo.',
    'auth/operation-not-allowed':'Esse tipo de login está desligado no Firebase. Em Authentication, ative "Anônimo" e "E-mail/senha".',
    'auth/admin-restricted-operation':'O login anônimo está desligado no Firebase. Em Authentication, ative "Anônimo".',
    'auth/invalid-api-key':'A configuração do Firebase está errada. Cole o firebaseConfig de novo.'
  })[c]||(/api-key/i.test(c)?'A configuração do Firebase está errada. Cole o firebaseConfig de novo.':'Não deu certo ('+(c||'erro desconhecido')+').');
}
let cloudUnsubs=[],devUnsub=null,qrSvg='',qrLoading=null,installEvt=null;
function stopCloud(){
  cloudUnsubs.forEach(u=>{try{u()}catch(e){}});cloudUnsubs=[];
  dayUnsubs.forEach(u=>{try{u()}catch(e){}});dayUnsubs=[];
  stockUnsubs.forEach(u=>{try{u()}catch(e){}});stockUnsubs=[];
  COLLS.forEach(c=>{state[c]={};remote[c]={}});
  state.stock={base:{}};remote.config=null;state.online={};onlineSeen=null;
  state.config=Object.assign({},DEF_CFG);state.layout=null;
  Object.keys(state.loaded).forEach(k=>{state.loaded[k]=false});state.timeout=false;
}
function startCloud(){
  stopCloud();
  watchCloud(backend.db);
  if(backend.mode==='fire'&&me.owner)cloudUnsubs.push(backend.db.collection('devices').onSnapshot(s=>{remote.devices=docsToMap(s);rebuild('devices');soft()},e=>{}));
  backend.siteDenied=false;
  if(backend.mode==='fire'&&me.owner)cloudUnsubs.push(backend.db.collection('online').where('status','==','novo').onSnapshot(s=>onOnline(docsToMap(s)),e=>{if(e&&e.code==='invalid_argument'){backend.siteDenied=true;soft()}}));
  render(true);
}
function fireSync(s){if(backend.mode!=='fire')return;setSync(!navigator.onLine?'offline':(s&&s.metadata&&s.metadata.hasPendingWrites)?'saving':'ok')}
async function resolveAccess(){
  const u=backend.F.auth.currentUser;if(!u)return;
  backend.uid=u.uid;backend.access='checking';stopCloud();render(true);
  let own=null;
  try{const s=await backend.db.doc('meta/owner').get();own=s.exists?s.data():null}
  catch(e){backend.mode='fberr';backend.fbErr=e&&e.code==='invalid_argument'?'O Firebase recusou o acesso. Confira se as regras de segurança foram coladas e publicadas na aba Regras do Firestore.':'Sem conexão com o Firebase agora. Confira a internet e tente de novo.';render(true);return}
  me.ownerUid=own?own.uid:null;me.ownerEmail=own?(own.email||''):'';
  if(devUnsub){devUnsub();devUnsub=null}
  if(own&&own.uid===u.uid){me.owner=true;me.write=true;backend.access='ok';ui.ownerLogin=false;startCloud();return}
  me.owner=false;me.write=false;
  if(!own){backend.access='claim';render(true);return}
  devUnsub=backend.db.doc('devices/'+u.uid).onSnapshot(s=>{
    const d=s.exists?s.data():null;backend.device=d;
    if(d&&d.ok){me.write=true;if(backend.access!=='ok'){backend.access='ok';startCloud()}else soft();return}
    const was=backend.access==='ok';
    backend.access=d?'pending':'new';me.write=false;
    if(was){stopCloud();logout(d?'':'O acesso deste aparelho foi removido pelo dono.')}else render(true);
  },e=>{backend.access='new';render(true)});
}
async function fbCreateOwner(email,pass){
  const F=backend.F;backend.claiming=true;
  try{
    const cred=await F.AU.createUserWithEmailAndPassword(F.auth,email,pass);
    backend.uid=cred.user.uid;
    await backend.db.doc('meta/owner').set({uid:cred.user.uid,email:email,at:Date.now()});
  }finally{backend.claiming=false}
  await resolveAccess();
}
async function fbOwnerSignIn(email,pass){
  const F=backend.F;backend.claiming=true;
  try{
    const cred=await F.AU.signInWithEmailAndPassword(F.auth,email,pass);
    backend.uid=cred.user.uid;
    const s=await backend.db.doc('meta/owner').get();
    if(!s.exists)await backend.db.doc('meta/owner').set({uid:cred.user.uid,email:email,at:Date.now()});
    else if(s.data().uid!==cred.user.uid){backend.claiming=false;await F.AU.signOut(F.auth);throw {msg:'Essa conta não é a do dono deste sistema.'}}
  }finally{backend.claiming=false}
  ui.ownerLogin=false;
  await resolveAccess();
}
async function fbSignOut(){const F=backend.F;logout();stopCloud();me.owner=false;me.write=false;backend.access='checking';render(true);try{await F.AU.signOut(F.auth)}catch(e){}}
async function requestDevice(name){await backend.db.doc('devices/'+backend.uid).set({ok:false,name:name.slice(0,40),code:String(1000+Math.floor(Math.random()*9000)),at:Date.now()})}
async function bootStandalone(){
  const cfg=getFbConfig();
  if(!cfg){
    if(lsGet(LS.demo)==='1'){backend.mode='local';me.owner=true;me.write=true;loadLocal();render(true);return}
    backend.mode='nocfg';render(true);return;
  }
  backend.cfg=cfg;
  try{backend.F=await initFirebase(cfg)}
  catch(e){backend.mode='fberr';backend.fbErr='Não consegui abrir o Firebase. Confira a internet ou cole a configuração de novo.';render(true);return}
  backend.mode='fire';backend.db=makeDb(backend.F);backend.access='checking';render(true);
  const AU=backend.F.AU,auth=backend.F.auth;
  AU.onAuthStateChanged(auth,u=>{
    if(!u){backend.uid=null;AU.signInAnonymously(auth).catch(e=>{backend.mode='fberr';backend.fbErr=authMsg(e);render(true)});return}
    if(backend.claiming||backend.uid===u.uid)return;
    resolveAccess();
  });
  window.addEventListener('online',()=>{setSync('ok');soft()});
  window.addEventListener('offline',()=>{setSync('offline');soft()});
}

  return '<div class="login">'+accTop()+'<form class="card setup" id="devForm"><h2 class="h2" style="margin-top:12px">Liberar este aparelho</h2><p class="hint">Dê um nome para o dono saber qual aparelho está pedindo acesso.</p><div class="fld"><label for="devName">Nome do aparelho</label><input id="devName" class="inp" maxlength="40" autocomplete="off" value="'+esc(f.name||'')+'" placeholder="Ex.: Celular do João"></div><div class="qchips" style="margin-top:10px">'+['Celular do garçom','Tablet da churrasqueira','Tablet da cozinha'].map(n=>'<button class="chip sm" type="button" data-act="devname" data-v="'+n+'">'+n+'</button>').join('')+'</div>'+(f.err?'<p class="err" role="alert">'+esc(f.err)+'</p>':'')+'<div class="row"><button class="btn pri big" type="submit"'+(f.busy?' disabled':'')+'>Pedir acesso</button></div></form>'+installHtml()+ownerLink+'</div>';
}
function loginExtras(){
  let h=installHtml();
  if(backend.mode==='fire'&&!me.owner)h+='<p style="text-align:center;margin-top:12px"><button class="lnk" data-act="ownerlogin">Sou o dono: entrar com e-mail e senha</button></p>';
  return h;
}
function gDevices(part){
  if(backend.mode!=='fire'||!me.owner)return '';
  const ds=Object.keys(state.devices).map(id=>Object.assign({id:id},state.devices[id])).filter(d=>d.id!==backend.uid);
  const pend=ds.filter(d=>!d.ok).sort((a,b)=>(a.at||0)-(b.at||0)),ok=ds.filter(d=>d.ok).sort((a,b)=>String(a.name).localeCompare(String(b.name),'pt-BR'));
  const url=inviteUrl(),wa='https://wa.me/?text='+encodeURIComponent('Abra este link no celular para usar o app do '+state.config.name+': '+url);
  if(part==='pend')return pend.length?'<h2 class="h2">Aparelhos pedindo acesso ('+pend.length+')</h2><div class="card" style="padding-block:0">'+pend.map(d=>'<div class="dev"><div class="dev-i"><b>'+esc(d.name||'Aparelho')+'</b><small>Código <span class="code">'+esc(d.code||'')+'</span> · pediu às '+hm(d.at||Date.now())+'</small></div><div class="dev-a"><button class="btn sm" data-act="devno" data-id="'+esc(d.id)+'">Recusar</button><button class="btn sm pri" data-act="devok" data-id="'+esc(d.id)+'">Liberar</button></div></div>').join('')+'</div>':'';
  return (pend.length?'':'<h2 class="h2">Aparelhos pedindo acesso (0)</h2><div class="card"><p class="hint" style="padding-top:10px">Nenhum aparelho esperando. Mande o link de convite abaixo.</p></div>')+
   '<h2 class="h2">Aparelhos liberados ('+ok.length+')</h2>'+(ok.length?'<div class="card" style="padding-block:0">'+ok.map(d=>'<div class="dev"><div class="dev-i"><b>'+esc(d.name||'Aparelho')+'</b><small>Liberado em '+dateBR(d.okAt||d.at)+'</small></div><div class="dev-a"><button class="btn sm danger" data-act="devno" data-id="'+esc(d.id)+'">'+(ui.dConfirm==='dev:'+d.id?'Confirmar remoção':'Remover acesso')+'</button></div></div>').join('')+'</div>':'<div class="card"><p class="hint" style="padding-top:10px">Nenhum ainda.</p></div>')+
   '<h2 class="h2">Convidar um aparelho</h2><div class="card"><p class="hint" style="padding-top:10px">Abra este link no celular ou tablet da equipe: mande no WhatsApp ou mostre o QR code. No aparelho, instale o app na tela inicial e peça acesso; depois é só liberar aqui em cima.</p>'+
   '<input id="invBox" class="inp" readonly value="'+esc(url)+'" aria-label="Link de convite" style="margin-top:10px;font:400 12px var(--f-mono)">'+
   '<div class="row"><button class="btn" data-act="invcopy">Copiar link</button><a class="btn alink" href="'+esc(wa)+'" target="_blank" rel="noopener">Enviar no WhatsApp</a></div>'+
   '<div class="qr" id="invQr">'+(qrSvg||'<button class="btn sm" data-act="invqr">Mostrar QR code</button>')+'</div></div>';
}
function accessCardHtml(){
  if(IS_ARTIFACT)return '<h2 class="h2">Acesso pelos aparelhos</h2><div class="card"><div class="perm">'+
   '<div><b>Seu celular</b><span>Entre com a sua conta Claude, a dona do sistema. Faturamento, fechamento de conta, cardápio, equipe e mapa só abrem nela.</span></div>'+
   '<div><b>Aparelhos da equipe</b><span>Garçons, churrasqueira e cozinha usam uma conta Claude do restaurante. Compartilhe este link com ela pelo menu Compartilhar, com permissão de edição. Ela lança e marca pedidos, mas o servidor não entrega o faturamento para ela.</span></div>'+
   '<div><b>Dentro do app</b><span>Cada pessoa entra com o próprio PIN. O PIN separa quem é quem; o bloqueio do faturamento é feito pela conta.</span></div></div></div>';
  if(backend.mode==='fire')return '<h2 class="h2">Acesso pelos aparelhos</h2><div class="card"><div class="perm">'+
   '<div><b>Seu celular</b><span>Conectado como dono'+(me.ownerEmail?' ('+esc(me.ownerEmail)+')':'')+'. Faturamento, fechamento de conta, cardápio, equipe e mapa só abrem com a conta do dono.</span></div>'+
   '<div><b>Aparelhos da equipe</b><span>Em Gerência › Equipe, mande o link de convite. Cada aparelho pede acesso e você libera. Ninguém precisa criar conta.</span></div>'+
   '<div><b>Dentro do app</b><span>Cada pessoa entra com o próprio PIN.</span></div></div>'+
   '<div class="row"><button class="btn sm danger" data-act="fbsignout">'+(ui.dConfirm==='signout'?'Toque de novo para desconectar':'Desconectar a conta do dono deste aparelho')+'</button></div></div>';
  return '<h2 class="h2">Modo demonstração</h2><div class="card"><p class="hint" style="padding-top:10px">Os dados ficam só neste aparelho. Para usar com a equipe, configure o app com o Firebase.</p><div class="row"><button class="btn pri" data-act="realsetup">Configurar o app de verdade</button></div></div>';
}
Object.assign(A,{
  demo:()=>{lsSet(LS.demo,'1');location.reload()},
  realsetup:()=>{lsSet(LS.demo,null);location.reload()},
  reload:()=>location.reload(),
  cfgreset:()=>{lsSet(LS.cfg,null);location.reload()},
  copyrules:()=>copyText(RULES,'rulesBox','Regras copiadas. Cole na aba Regras do Firestore e clique em Publicar.'),
  accswap:()=>{ui.acc.signin=!ui.acc.signin;ui.acc.err='';render(true)},
  accback:()=>{ui.ownerLogin=false;ui.acc.err='';render(true)},
  accreset:async()=>{
    const email=(($('#accEmail')||{}).value||'').trim();
    if(!email){ui.acc.err='Digite o e-mail para receber o link de nova senha.';render(true);return}
    try{await backend.F.AU.sendPasswordResetEmail(backend.F.auth,email);ui.acc.err='';toast('Enviamos um e-mail para você criar uma senha nova.')}catch(x){ui.acc.err=authMsg(x);render(true)}
  },
  ownerlogin:()=>{ui.ownerLogin=true;ui.acc.signin=true;ui.acc.err='';render(true)},
  devname:el=>{const i=$('#devName');if(i){i.value=el.dataset.v;i.focus()}},
  install:async()=>{if(!installEvt)return;const ev=installEvt;installEvt=null;try{ev.prompt();await ev.userChoice}catch(e){}render(true)},
  devok:el=>{if(!isMgr())return;upd('devices',el.dataset.id,{ok:true,okAt:Date.now()});render(true);toast('Aparelho liberado.')},
  devno:el=>{
    if(!isMgr())return;const id=el.dataset.id,d=state.devices[id];
    if(d&&d.ok&&ui.dConfirm!=='dev:'+id){ui.dConfirm='dev:'+id;render(true);return}
    ui.dConfirm=null;del('devices',id);render(true);toast(d&&d.ok?'Acesso removido.':'Pedido recusado.');
  },
  invcopy:()=>copyText(inviteUrl(),'invBox','Link copiado. Mande para o aparelho da equipe.'),
  invqr:async()=>{try{const q=await loadQr(),g=q(0,'M');g.addData(inviteUrl());g.make();qrSvg='<img src="'+g.createDataURL(6,8)+'" alt="QR code do convite" width="220" height="220">';render(true)}catch(x){toast('Não consegui gerar o QR agora. Use o link.')}},
  fbsignout:()=>{if(ui.dConfirm!=='signout'){ui.dConfirm='signout';render(true);return}ui.dConfirm=null;fbSignOut()}
});
document.addEventListener('submit',async e=>{
  const id=e.target.id;
  if(id==='cfgForm'){
    const f=ui.cfgForm||(ui.cfgForm={}),c=parseCfg(($('#cfgPaste')||{}).value);
    if(!c){f.err='Não reconheci a configuração. Cole o bloco inteiro do firebaseConfig (precisa ter apiKey, projectId e appId).';render(true);return}
    lsSet(LS.cfg,JSON.stringify(c));lsSet(LS.demo,null);location.reload();
  }else if(id==='invForm'){
    const f=ui.cfgForm||(ui.cfgForm={}),c=parseCfg(($('#invPaste')||{}).value);
    if(!c){f.inv='Esse link não parece um convite do app. Peça ao dono para mandar de novo.';render(true);return}
    lsSet(LS.cfg,JSON.stringify(c));lsSet(LS.demo,null);location.reload();
  }else if(id==='accForm'){
    const f=ui.acc;if(f.busy)return;
    const email=(($('#accEmail')||{}).value||'').trim(),p1=($('#accPass')||{}).value||'',p2=($('#accPass2')||{}).value||'';
    const creating=backend.access==='claim'&&!f.signin;
    f.email=email;f.err='';
    if(!email){f.err='Digite o e-mail.';render(true);return}
    if(!p1){f.err='Digite a senha.';render(true);return}
    if(creating&&p1.length<6){f.err='A senha precisa ter pelo menos 6 caracteres.';render(true);return}
    if(creating&&p1!==p2){f.err='As duas senhas não batem.';render(true);return}
    f.busy=true;render(true);
    try{if(creating)await fbCreateOwner(email,p1);else await fbOwnerSignIn(email,p1);f.busy=false;f.signin=false;render(true)}
    catch(x){f.busy=false;f.err=x&&x.msg?x.msg:(x&&x.code==='invalid_argument'?'O Firebase recusou. Confira se as regras de segurança foram publicadas.':authMsg(x));render(true)}
  }else if(id==='devForm'){
    const f=ui.acc,name=(($('#devName')||{}).value||'').trim();
    f.name=name;
    if(!name){f.err='Dê um nome para este aparelho (ex.: Celular do João).';render(true);return}
    f.err='';f.busy=true;render(true);
    try{await requestDevice(name);f.busy=false}
    catch(x){f.busy=false;f.err=x&&x.code==='invalid_argument'?'O Firebase recusou o pedido. Confira as regras de segurança.':'Não consegui pedir acesso agora. Confira a internet.';render(true)}
  }
});

/* ---------- início ---------- */
async function boot(){
  loadDrafts();loadSession();
  if(session&&session.kind==='staff'&&(Date.now()-(session.at||0)>12*3600e3||(session.role==='gerente'&&Date.now()-(session.at||0)>IDLE_MS))){session=null;saveSession()}
  render(true);
  if(!IS_ARTIFACT){await bootStandalone();return}
  let db=null,user=null;
  try{if(window.claude&&window.claude.use){const r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);db=r[0];user=r[1]}}catch(e){}
  if(db){
    backend.mode='cloud';backend.db=db;backend.user=user;
    if(user){
      try{me.owner=!!(await user.isOwner())}catch(e){}
      try{const w=await user.can('data.write');me.write=w===null?true:!!w}catch(e){}
    }
    watchCloud(db);
  }else{
    backend.mode='local';me.owner=true;me.write=true;loadLocal();
  }
  render(true);
}
boot();
})();
